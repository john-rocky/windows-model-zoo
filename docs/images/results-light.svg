<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 218" width="860" height="218" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Quick checks and the real job can disagree</title>
<desc id="d">Of 86 LLM packages that passed a text-quality check, 58 passed the task check and 28 failed it. Of 47 vision and audio files that failed a raw-output comparison, 19 passed the task check and 28 failed it.</desc>
<text x="0" y="30" font-size="20" font-weight="600" fill="#0b0b0b">Quick checks and the real job can disagree</text>
<rect x="0" y="44" width="14" height="14" rx="4" fill="#2a78d6"/>
<text x="20" y="56" font-size="14" font-weight="400" fill="#52514e">Passed the task check</text>
<rect x="180" y="44" width="14" height="14" rx="4" fill="#eb6834"/>
<text x="200" y="56" font-size="14" font-weight="400" fill="#52514e">Failed the task check</text>
<text x="0" y="96" font-size="15" font-weight="400" fill="#0b0b0b">86 LLM packages that passed a text-quality check</text>
<rect x="0" y="106" width="579" height="28" rx="4" fill="#2a78d6"/>
<rect x="581" y="106" width="279" height="28" rx="4" fill="#eb6834"/>
<text x="10" y="125" font-size="14" font-weight="600" fill="#ffffff">58 passed</text>
<text x="591" y="125" font-size="14" font-weight="600" fill="#0b0b0b">28 failed</text>
<text x="0" y="168" font-size="15" font-weight="400" fill="#0b0b0b">47 vision and audio files that failed a raw-output comparison</text>
<rect x="0" y="178" width="189" height="28" rx="4" fill="#2a78d6"/>
<rect x="191" y="178" width="279" height="28" rx="4" fill="#eb6834"/>
<text x="10" y="197" font-size="14" font-weight="600" fill="#ffffff">19 passed</text>
<text x="201" y="197" font-size="14" font-weight="600" fill="#0b0b0b">28 failed</text>
</svg>
