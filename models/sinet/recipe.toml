# sinet: the cells copied from the vision zoo john-rocky/windows-zoo@faa4019 keep its numbers and its line; the cells task-* (2026-11-10) judge the same files on this model's task line (PLAN.md)

[model]
kind = "vision"
title = "sinet"
group = "main"
order = 35
source = "litert-community/SINet-V2-Camouflage-LiteRT"
source_revision = "3863d70a7f738df7d5421a72b1408631b8b5ecd6"
source_file = "sinet.tflite"
license = "apache-2.0"
pipeline_tag = "image-segmentation"
notes = []
migrated_from = "john-rocky/windows-zoo@faa4019"
task = "mask"
inputs = "suites/vision/images.json"

[[fetch]]
repo = "mlboydaisuke/SINet-V2-Camouflage-OpenVINO"
revision = "30fd63d4c645aa528a22b67913595d800cb4285f"
include = ["npu/sinet.blob", "sinet.onnx"]
why = "the vision zoo's files of this model's task cells (the same sha256 as the files measured)"

[[form]]
id = "z1-npu-blob"
short = "NPU blob"
label = "Z1's precompiled Intel NPU blob of it (OpenVINO 2026.4.1 compile_model + export_model), checked by sha256"
made_by = "the vision zoo Z1"
path = "{HUB}\\mlboydaisuke__SINet-V2-Camouflage-OpenVINO\\npu\\sinet.blob"
sha256 = "2690b24fb5baff802c0be7f4f45630c9a4e4e513108a733c2faa5fb33d4a283d"
from = "mlboydaisuke/SINet-V2-Camouflage-OpenVINO"
public = "mlboydaisuke/SINet-V2-Camouflage-OpenVINO@30fd63d4c645aa528a22b67913595d800cb4285f:npu/sinet.blob"

[[form]]
id = "z1-onnx-fp32"
short = "fp32"
label = "the fp32 ONNX file the vision zoo Z1 measured (tf2onnx 1.17.0 from the source .tflite), in Z1's folder on the PC, checked by sha256"
made_by = "the vision zoo Z1"
path = "{HUB}\\mlboydaisuke__SINet-V2-Camouflage-OpenVINO\\sinet.onnx"
sha256 = "f642ca17d68b7bcd359a2087c333665062f49875f1c26eeceb8938b6898c6434"
from = "mlboydaisuke/SINet-V2-Camouflage-OpenVINO"
public = "mlboydaisuke/SINet-V2-Camouflage-OpenVINO@30fd63d4c645aa528a22b67913595d800cb4285f:sinet.onnx"

[[step]]
name = "task-ref"
phase = "before"
venv = "z1-ort"
script = "pc/ref_vision_task.py"
args = [
  "--model",
  "sinet",
  "--spec",
  "{ROOT}\\pc\\z5_spec.json",
  "--fixtures",
  "{FIX}",
  "--suites",
  "{ROOT}\\suites",
  "--work",
  "{ROOT}\\work\\sinet",
  "--out",
  "{ROOT}\\refs\\sinet\\ref.json",
]
timeout_min = 30
ram_gb = 2
reference = "refs/sinet/ref.json"

[[line]]
id = "z1-internal"
kind = "internal"
rule = "every output: cos >= 0.99 against the ONNX Runtime CPU EP fp32 output (yolact: OpenVINO CPU f32), no NaN / Inf; a class output: argmax agreement >= 0.99"
written = "2026-11-06T10:40:00+09:00"
written_note = "10:4x JST, before any run (windows-zoo ROUND1.md line 10); first run 12:53"
plan = "john-rocky/windows-zoo PLAN.md section 3"

[[line]]
id = "z1-tflite"
kind = "internal"
rule = "the ONNX file against the .tflite it was converted from (LiteRT interpreter, CPU, the same inputs): the PLAN section 3 line"
written = "2026-11-06T16:30:00+09:00"
written_note = "16:3x JST, PLAN.md Changes (after the first pass, before the quiet pass)"
plan = "john-rocky/windows-zoo PLAN.md, Changes 2026-11-06 16:3x"

[[line]]
id = "task-mask"
kind = "task"
rule = "mask, the app's camouflage map (john-rocky/LiteRT-Models@96e0bc1f/sinet/.../CamouflageDetector.kt: the sigmoid map it overlays) as object = map > 0.5 (schema/lines.md: matting, alpha > 0.5), at the output's 352 x 352: the mIoU of object and background against the reference's mask, from the pixels of all inputs, the mean over the classes the reference has, >= 0.95. Inputs: the 20 images of suites/vision/images.json, each stretched to 352 x 352, ImageNet normalization. Reference: the same fp32 ONNX file (the one the vision zoo Z1 measured) on the ONNX Runtime 1.31.1 CPU EP, on the same inputs (Z1's cpu cell)."
written = "2026-11-10T06:41:00+09:00"
plan = "PLAN.md section Z5 (the Z5 lane, written 06:41 JST before any run of its cells)"

[[cell]]
id = "ovnpu"
runtime = "ort-ov"
device = "npu"
form = "onnx-fp32"
line = "z1-internal"
migrated = true
script = "windows-zoo:pc/zoo_run.py"

[[cell]]
id = "ovnpu_pre"
runtime = "openvino"
device = "npu"
form = "npu-blob"
line = "z1-internal"
migrated = true
script = "windows-zoo:pc/zoo_run.py"

[[cell]]
