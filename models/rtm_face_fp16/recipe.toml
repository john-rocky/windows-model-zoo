[[step]]
name = "task-ref"
phase = "before"
venv = "z1-ort"
script = "pc/ref_vision_task.py"
args = [
  "--model",
  "rtm_face_fp16",
  "--spec",
  "{ROOT}\\pc\\z5_spec.json",
  "--fixtures",
  "{FIX}",
  "--suites",
  "{ROOT}\\suites",
  "--work",
  "{ROOT}\\work\\rtm_face_fp16",
  "--out",
  "{ROOT}\\refs\\rtm_face_fp16\\ref.json",
]
timeout_min = 30
ram_gb = 2
reference = "refs/rtm_face_fp16/ref.json"

[[line]]
id = "z1-internal"
kind = "internal"
rule = "every output: cos >= 0.99 against the ONNX Runtime CPU EP fp32 output (yolact: OpenVINO CPU f32), no NaN / Inf; a class output: argmax agreement >= 0.99"
written = "2026-11-06T10:40:00+09:00"
written_note = "10:4x JST, before any run (windows-zoo ROUND1.md line 10); first run 12:53"
plan = "john-rocky/windows-zoo PLAN.md section 3"

[[line]]
id = "z1-tflite"
kind = "internal"
rule = "the ONNX file against the .tflite it was converted from (LiteRT interpreter, CPU, the same inputs): the PLAN section 3 line"
written = "2026-11-06T16:30:00+09:00"
written_note = "16:3x JST, PLAN.md Changes (after the first pass, before the quiet pass)"
plan = "john-rocky/windows-zoo PLAN.md, Changes 2026-11-06 16:3x"

[[line]]
id = "task-keypoints"
kind = "task"
rule = "keypoints, the app's points (john-rocky/LiteRT-Models@96e0bc1f/rtmface/.../RtmFaceEstimator.kt: per point the argmax of the SimCC x and y bins, x = bin / 2, y = bin / 2, score = the mean of the two maxima; all 98 shown (MainActivity.kt draws every point)): of the points either side shows, a point agrees when both show it and the two positions are within 0.02 of the model input's diagonal (7.24 px of 256 x 256); the agreeing points are >= 95 % of the points either side shows, summed over the inputs. Inputs: the images of suites/vision/images.json that show the model's subject (the app takes a crop of one face; chosen by looking at the images before any run): gaze, hsemotion, rtmface, tddfa (4 images); each centre-square cropped to 256 x 256, (x - [123.675, 116.28, 103.53]) / [58.395, 57.12, 57.375] on 0-255 RGB. Reference: the same fp32 ONNX file (the one the vision zoo Z1 measured) on the ONNX Runtime 1.31.1 CPU EP, on the same inputs (Z1's cpu cell)."
written = "2026-11-10T06:41:00+09:00"
plan = "PLAN.md section Z5 (the Z5 lane, written 06:41 JST before any run of its cells)"

