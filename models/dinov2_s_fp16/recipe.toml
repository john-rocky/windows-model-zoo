notes = []
migrated_from = "john-rocky/windows-zoo@faa4019"
task = "retrieval"
inputs = "suites/vision/images.json"

[[fetch]]
repo = "mlboydaisuke/DINOv2-ViT-S14-OpenVINO"
revision = "8e89c4dcfc15b18b01701c240a90c52f38b6ff02"
include = ["dinov2_s_fp16.onnx", "npu/dinov2_s_fp16.blob"]
