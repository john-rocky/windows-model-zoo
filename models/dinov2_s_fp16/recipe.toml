[[form]]
id = "z1-npu-blob"
short = "NPU blob"
label = "Z1's precompiled Intel NPU blob of it (OpenVINO 2026.4.1 compile_model + export_model), checked by sha256"
made_by = "the vision zoo Z1"
path = "{HUB}\\mlboydaisuke__DINOv2-ViT-S14-OpenVINO\\npu\\dinov2_s_fp16.blob"
sha256 = "dc8b1157d21d528bc89041b7ec59287b98cacd17a1f67e878a9b70299ff52106"
from = "mlboydaisuke/DINOv2-ViT-S14-OpenVINO"
public = "mlboydaisuke/DINOv2-ViT-S14-OpenVINO@8e89c4dcfc15b18b01701c240a90c52f38b6ff02:npu/dinov2_s_fp16.blob"

[[form]]
id = "z1-onnx-fp32"
short = "fp32"
label = "the fp32 ONNX file the vision zoo Z1 measured (tf2onnx 1.17.0 from the source .tflite), checked by sha256"
made_by = "the vision zoo Z1"
path = "{HUB}\\mlboydaisuke__DINOv2-ViT-S14-OpenVINO\\dinov2_s_fp16.onnx"
sha256 = "8f36d01fe1635da9d09b4958e17a9b43c8b25438a4422e59cab1f4414d506625"
from = "mlboydaisuke/DINOv2-ViT-S14-OpenVINO"
public = "mlboydaisuke/DINOv2-ViT-S14-OpenVINO@8e89c4dcfc15b18b01701c240a90c52f38b6ff02:dinov2_s_fp16.onnx"

[[step]]
name = "task-ref"
phase = "before"
venv = "z1-ort"
script = "pc/ref_vision_task.py"
args = [
  "--model",
  "dinov2_s_fp16",
  "--spec",
  "{ROOT}\\pc\\z5_spec.json",
  "--fixtures",
  "{FIX}",
  "--suites",
  "{ROOT}\\suites",
  "--work",
  "{ROOT}\\work\\dinov2_s_fp16",
  "--out",
  "{ROOT}\\refs\\dinov2_s_fp16\\ref.json",
]
timeout_min = 30
ram_gb = 2
reference = "refs/dinov2_s_fp16/ref.json"

[[line]]
id = "z1-internal"
kind = "internal"
rule = "every output: cos >= 0.99 against the ONNX Runtime CPU EP fp32 output (yolact: OpenVINO CPU f32), no NaN / Inf; a class output: argmax agreement >= 0.99"
written = "2026-11-06T10:40:00+09:00"
written_note = "10:4x JST, before any run (windows-zoo ROUND1.md line 10); first run 12:53"
plan = "john-rocky/windows-zoo PLAN.md section 3"

[[line]]
id = "z1-tflite"
kind = "internal"
rule = "the ONNX file against the .tflite it was converted from (LiteRT interpreter, CPU, the same inputs): the PLAN section 3 line"
written = "2026-11-06T16:30:00+09:00"
written_note = "16:3x JST, PLAN.md Changes (after the first pass, before the quiet pass)"
plan = "john-rocky/windows-zoo PLAN.md, Changes 2026-11-06 16:3x"

[[line]]
id = "task-retrieval"
kind = "task"
rule = "features, through a downstream task (the model has no task head; the app's own use, john-rocky/LiteRT-Models@96e0bc1f/dinov2/.../Dinov2Features.kt, is a picture of the top 3 principal components of the tokens, whose components flip and swap with small changes of the tokens): image retrieval, each image's embedding = the mean of its 1024 patch tokens; for each input, the most cosine-similar other input under the cell's embeddings is the one under the reference's embeddings on >= 95 % of the inputs, an input whose reference first and second similarities differ by < 0.01 not counted (how many: an instrument). Inputs: the 20 images of suites/vision/images.json, each stretched to 448 x 448, ImageNet normalization. Reference: the same fp32 ONNX file (the one the vision zoo Z1 measured) on the ONNX Runtime 1.31.1 CPU EP, on the same inputs (Z1's cpu cell)."
written = "2026-11-10T06:41:00+09:00"
plan = "PLAN.md section Z5 (the Z5 lane, written 06:41 JST before any run of its cells)"

