kind = "task"
rule = "detection, the app's boxes (john-rocky/LiteRT-Models@96e0bc1f/ssdlite/.../SSDLiteDetector.kt: per anchor the softmax over the 91 classes, the best of classes 1..90, kept at >= 0.4, the box from BoxCoder (10, 10, 5, 5) on the default boxes of the six levels, clipped to the 320 x 320 input, per-class NMS at IoU > 0.55, the first 100): a cell box pairs with a reference box of the same class at IoU >= 0.5, one to one, the cell's boxes taken in descending score; the pairs are >= 95 % of the reference's boxes and >= 95 % of the cell's boxes, summed over the inputs (a set without a reference box has no verdict). Inputs: the 20 images of suites/vision/images.json, each stretched to 320 x 320, RGB / 127.5 - 1. Reference: the same fp32 ONNX file (the one the vision zoo Z1 measured) on the ONNX Runtime 1.31.1 CPU EP, on the same inputs (Z1's cpu cell)."
written = "2026-11-10T06:41:00+09:00"
plan = "PLAN.md section Z5 (the Z5 lane, written 06:41 JST before any run of its cells)"

