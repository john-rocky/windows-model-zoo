script = "pc/ref_vision_task.py"
args = [
  "--model",
  "rtmw_fp16",
  "--spec",
  "{ROOT}\\pc\\z5_spec.json",
  "--fixtures",
  "{FIX}",
  "--suites",
  "{ROOT}\\suites",
