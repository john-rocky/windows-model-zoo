from = "mlboydaisuke/RTMPose-Hand-OpenVINO"
public = "mlboydaisuke/RTMPose-Hand-OpenVINO@f02d81bca4e44e22386a87181daf854915693168:npu/rtmhand_fp16.blob"

[[form]]
id = "z1-onnx-fp16"
short = "fp16"
