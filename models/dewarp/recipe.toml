# dewarp: the cells copied from the vision zoo john-rocky/windows-zoo@faa4019 keep its numbers and its line; the cells task-* (2026-11-10) judge the same files on this model's task line (PLAN.md)

[model]
kind = "vision"
title = "dewarp"
group = "main"
order = 10
source = "litert-community/DewarpNet-LiteRT"
source_revision = "dfc68e3e462a6eb7eb8c4dbbff4049e3bd3cc9e3"
source_file = "dewarp.tflite"
license = "mit"
pipeline_tag = "image-to-image"
notes = []
migrated_from = "john-rocky/windows-zoo@faa4019"
task = "warp"
inputs = "suites/vision/images.json"

[[fetch]]
repo = "mlboydaisuke/DewarpNet-OpenVINO"
revision = "ace77f6bff29c42d34b690a30b313b76e6d8299e"
include = ["dewarp.onnx"]
why = "the vision zoo's files of this model's task cells (the same sha256 as the files measured)"

[[form]]
id = "z1-onnx-fp32"
short = "fp32"
label = "the fp32 ONNX file the vision zoo Z1 measured (tf2onnx 1.17.0 from the source .tflite), checked by sha256"
made_by = "the vision zoo Z1"
path = "{HUB}\\mlboydaisuke__DewarpNet-OpenVINO\\dewarp.onnx"
sha256 = "4dde2be5fa86a4b4b1dd870b0ba89dc5da6e2165b90992c13a96450935eb04c2"
from = "mlboydaisuke/DewarpNet-OpenVINO"
public = "mlboydaisuke/DewarpNet-OpenVINO@ace77f6bff29c42d34b690a30b313b76e6d8299e:dewarp.onnx"

[[step]]
name = "task-ref"
phase = "before"
venv = "z1-ort"
script = "pc/ref_vision_task.py"
args = [
  "--model",
  "dewarp",
  "--spec",
  "{ROOT}\\pc\\z5_spec.json",
  "--fixtures",
  "{FIX}",
  "--suites",
  "{ROOT}\\suites",
  "--work",
  "{ROOT}\\work\\dewarp",
  "--out",
  "{ROOT}\\refs\\dewarp\\ref.json",
]
timeout_min = 30
ram_gb = 2
reference = "refs/dewarp/ref.json"

[[line]]
id = "z1-internal"
kind = "internal"
rule = "every output: cos >= 0.99 against the ONNX Runtime CPU EP fp32 output (yolact: OpenVINO CPU f32), no NaN / Inf; a class output: argmax agreement >= 0.99"
written = "2026-11-06T10:40:00+09:00"
written_note = "10:4x JST, before any run (windows-zoo ROUND1.md line 10); first run 12:53"
plan = "john-rocky/windows-zoo PLAN.md section 3"

[[line]]
id = "z1-tflite"
kind = "internal"
rule = "the ONNX file against the .tflite it was converted from (LiteRT interpreter, CPU, the same inputs): the PLAN section 3 line"
written = "2026-11-06T16:30:00+09:00"
written_note = "16:3x JST, PLAN.md Changes (after the first pass, before the quiet pass)"
plan = "john-rocky/windows-zoo PLAN.md, Changes 2026-11-06 16:3x"

[[line]]
id = "task-warp"
kind = "task"
rule = "unwarp geometry, the app's sampling (john-rocky/LiteRT-Models@96e0bc1f/dewarp/.../DocumentDewarper.kt: each of the 384 x 384 output pixels reads the source where the bilinearly read 128 x 128 backward map points): the source position in pixels of the 256 x 256 model input; the cell's position is within 1.0 px of the reference's for >= 95 % of the output pixels of all inputs. Not the PSNR of the unwarped picture: a sub-pixel shift of a sharp edge moves a pixel's value by tens of levels with no visible change; the PSNR of the app's 384 x 384 picture is an instrument. Inputs: the 20 images of suites/vision/images.json, each stretched to 256 x 256, BGR / 255. Reference: the same fp32 ONNX file (the one the vision zoo Z1 measured) on the ONNX Runtime 1.31.1 CPU EP, on the same inputs (Z1's cpu cell)."
written = "2026-11-10T06:41:00+09:00"
plan = "PLAN.md section Z5 (the Z5 lane, written 06:41 JST before any run of its cells)"

[[cell]]
id = "ovnpu"
runtime = "ort-ov"
device = "npu"
form = "onnx-fp32"
line = "z1-internal"
migrated = true
script = "windows-zoo:pc/zoo_run.py"

[[cell]]
id = "ovnpu_pre"
runtime = "openvino"
device = "npu"
form = "npu-blob"
line = "z1-internal"
migrated = true
script = "windows-zoo:pc/zoo_run.py"

[[cell]]
id = "ovgpu"
runtime = "ort-ov"
device = "igpu"
form = "onnx-fp32"
line = "z1-internal"
migrated = true
script = "windows-zoo:pc/zoo_run.py"

[[cell]]
id = "cuda16"
runtime = "ort-cuda"
device = "rtx"
form = "onnx-fp16"
line = "z1-internal"
migrated = true
script = "windows-zoo:pc/zoo_run.py"

[[cell]]
id = "cuda32"
runtime = "ort-cuda"
device = "rtx"
form = "onnx-fp32"
line = "z1-internal"
migrated = true
script = "windows-zoo:pc/zoo_run.py"

[[cell]]
id = "cpu"
runtime = "ort"
device = "cpu"
form = "onnx-fp32"
line = "z1-internal"
migrated = true
script = "windows-zoo:pc/zoo_run.py"

[[cell]]
id = "tflite"
runtime = "litert"
device = "cpu"
form = "tflite"
line = "z1-tflite"
migrated = true
script = "windows-zoo:convert/check_tflite.py"

[[cell]]
id = "qhub-s26-npu"
runtime = "qnn"
device = "s26-npu"
form = "pqo"
migrated = true
script = "qai-hub profile job"

[[cell]]
id = "qhub-x2e-npu"
runtime = "qnn"
device = "x2e-npu"
form = "pqo"
migrated = true
script = "qai-hub profile job"

[[cell]]
id = "qhub-x2e-npu-onnx"
runtime = "qnn"
device = "x2e-npu"
form = "onnx"
migrated = true
script = "qai-hub profile job"

[[cell]]
id = "task-ovgpu"
runtime = "onnxruntime-openvino"
device = "igpu"
form = "z1-onnx-fp32"
line = "task-warp"
venv = "z1-ort"
script = "pc/run_vision_task.py"
args = [
  "--model",
  "dewarp",
  "--spec",
  "{ROOT}\\pc\\z5_spec.json",
  "--work",
  "{ROOT}\\work\\dewarp",
  "--form",
  "fp32",
  "--engine",
  "ort",
  "--ep",
  "openvino",
  "--ov-device",
  "GPU.0",
]
timeout_min = 20
ram_need_gb = 3
z1_cell = "ovgpu"
