# dmcount: the cells copied from the vision zoo john-rocky/windows-zoo@faa4019 keep its numbers and its line; the cells task-* (2026-11-10) judge the same files on this model's task line (PLAN.md)

[model]
kind = "vision"
title = "dmcount"
group = "main"
order = 8
source = "litert-community/DM-Count-Crowd-LiteRT"
source_revision = "5934338595e4d963b9f73f1c5b903bce4abc5b7a"
source_file = "dmcount.tflite"
license = "mit"
pipeline_tag = "image-to-image"
notes = []
migrated_from = "john-rocky/windows-zoo@faa4019"
task = "count"
inputs = "suites/vision/images.json"

[[fetch]]
repo = "mlboydaisuke/DM-Count-Crowd-OpenVINO"
revision = "9a1d62c34612539efea53085f65144205908656d"
include = ["dmcount.onnx"]
why = "the vision zoo's files of this model's task cells (the same sha256 as the files measured)"

[[form]]
id = "z1-onnx-fp32"
short = "fp32"
label = "the fp32 ONNX file the vision zoo Z1 measured (tf2onnx 1.17.0 from the source .tflite), in Z1's folder on the PC, checked by sha256"
made_by = "the vision zoo Z1"
path = "{HUB}\\mlboydaisuke__DM-Count-Crowd-OpenVINO\\dmcount.onnx"
sha256 = "3e5a6c65a35f68f3115b23483f07cd7f0c1e7ad3c87db39638f1184852d96197"
from = "mlboydaisuke/DM-Count-Crowd-OpenVINO"
public = "mlboydaisuke/DM-Count-Crowd-OpenVINO@9a1d62c34612539efea53085f65144205908656d:dmcount.onnx"

[[step]]
name = "task-ref"
phase = "before"
venv = "z1-ort"
script = "pc/ref_vision_task.py"
args = [
  "--model",
  "dmcount",
  "--spec",
  "{ROOT}\\pc\\z5_spec.json",
  "--fixtures",
  "{FIX}",
  "--suites",
  "{ROOT}\\suites",
  "--work",
  "{ROOT}\\work\\dmcount",
  "--out",
  "{ROOT}\\refs\\dmcount\\ref.json",
]
timeout_min = 30
ram_gb = 2
reference = "refs/dmcount/ref.json"

[[line]]
id = "z1-internal"
kind = "internal"
rule = "every output: cos >= 0.99 against the ONNX Runtime CPU EP fp32 output (yolact: OpenVINO CPU f32), no NaN / Inf; a class output: argmax agreement >= 0.99"
written = "2026-11-06T10:40:00+09:00"
written_note = "10:4x JST, before any run (windows-zoo ROUND1.md line 10); first run 12:53"
plan = "john-rocky/windows-zoo PLAN.md section 3"

[[line]]
id = "z1-tflite"
kind = "internal"
rule = "the ONNX file against the .tflite it was converted from (LiteRT interpreter, CPU, the same inputs): the PLAN section 3 line"
written = "2026-11-06T16:30:00+09:00"
written_note = "16:3x JST, PLAN.md Changes (after the first pass, before the quiet pass)"
plan = "john-rocky/windows-zoo PLAN.md, Changes 2026-11-06 16:3x"

[[line]]
id = "task-count"
kind = "task"
rule = "count, the app's number (john-rocky/LiteRT-Models@96e0bc1f/crowdcount/.../CrowdCounter.kt: the sum of the 64 x 64 density map, shown rounded by MainActivity.kt): |cell count - reference count| <= max(0.5, 2 % of the reference count) on >= 95 % of the inputs. Inputs: the 20 images of suites/vision/images.json, each stretched to 512 x 512, ImageNet normalization. Reference: the same fp32 ONNX file (the one the vision zoo Z1 measured) on the ONNX Runtime 1.31.1 CPU EP, on the same inputs (Z1's cpu cell)."
written = "2026-11-10T06:41:00+09:00"
plan = "PLAN.md section Z5 (the Z5 lane, written 06:41 JST before any run of its cells)"

[[cell]]
id = "ovnpu"
runtime = "ort-ov"
device = "npu"
form = "onnx-fp32"
line = "z1-internal"
migrated = true
script = "windows-zoo:pc/zoo_run.py"

[[cell]]
id = "ovnpu_pre"
runtime = "openvino"
device = "npu"
form = "npu-blob"
line = "z1-internal"
migrated = true
script = "windows-zoo:pc/zoo_run.py"

[[cell]]
id = "ovgpu"
runtime = "ort-ov"
device = "igpu"
form = "onnx-fp32"
line = "z1-internal"
migrated = true
script = "windows-zoo:pc/zoo_run.py"

[[cell]]
id = "cuda16"
runtime = "ort-cuda"
device = "rtx"
form = "onnx-fp16"
line = "z1-internal"
migrated = true
script = "windows-zoo:pc/zoo_run.py"

[[cell]]
id = "cuda32"
runtime = "ort-cuda"
device = "rtx"
form = "onnx-fp32"
line = "z1-internal"
migrated = true
script = "windows-zoo:pc/zoo_run.py"

[[cell]]
id = "cpu"
runtime = "ort"
device = "cpu"
form = "onnx-fp32"
line = "z1-internal"
migrated = true
script = "windows-zoo:pc/zoo_run.py"

[[cell]]
id = "tflite"
runtime = "litert"
device = "cpu"
form = "tflite"
line = "z1-tflite"
migrated = true
script = "windows-zoo:convert/check_tflite.py"

[[cell]]
id = "qhub-s26-npu"
runtime = "qnn"
device = "s26-npu"
form = "pqo"
migrated = true
script = "qai-hub profile job"

[[cell]]
id = "qhub-x2e-npu"
runtime = "qnn"
device = "x2e-npu"
form = "pqo"
migrated = true
script = "qai-hub profile job"

[[cell]]
id = "qhub-x2e-npu-onnx"
runtime = "qnn"
device = "x2e-npu"
form = "onnx"
migrated = true
script = "qai-hub profile job"

[[cell]]
id = "task-ovgpu"
runtime = "onnxruntime-openvino"
device = "igpu"
form = "z1-onnx-fp32"
line = "task-count"
venv = "z1-ort"
script = "pc/run_vision_task.py"
args = [
  "--model",
  "dmcount",
  "--spec",
  "{ROOT}\\pc\\z5_spec.json",
  "--work",
  "{ROOT}\\work\\dmcount",
  "--form",
  "fp32",
  "--engine",
  "ort",
  "--ep",
  "openvino",
  "--ov-device",
  "GPU.0",
]
timeout_min = 20
ram_need_gb = 3
z1_cell = "ovgpu"
