from = "mlboydaisuke/wav2vec2-keyword-spotting-OpenVINO"
public = "mlboydaisuke/wav2vec2-keyword-spotting-OpenVINO@f0983dbb084f2d5fdb6dd207e7e6fda26e107289:w2v2_frontend_fp16.onnx"

[[step]]
name = "task-ref"
phase = "before"
venv = "z1-ort"
script = "pc/ref_vision_task.py"
args = [
  "--model",
  "w2v2_frontend_fp16",
  "--spec",
  "{ROOT}\\pc\\z5_spec.json",
  "--fixtures",
  "{FIX}",
  "--suites",
  "{ROOT}\\suites",
  "--work",
  "{ROOT}\\work\\w2v2_frontend_fp16",
  "--out",
  "{ROOT}\\refs\\w2v2_frontend_fp16\\ref.json",
]
timeout_min = 30
ram_gb = 2
reference = "refs/w2v2_frontend_fp16/ref.json"

[[line]]
id = "z1-internal"
kind = "internal"
rule = "every output: cos >= 0.99 against the ONNX Runtime CPU EP fp32 output (yolact: OpenVINO CPU f32), no NaN / Inf; a class output: argmax agreement >= 0.99"
written = "2026-11-06T10:40:00+09:00"
written_note = "10:4x JST, before any run (windows-zoo ROUND1.md line 10); first run 12:53"
plan = "john-rocky/windows-zoo PLAN.md section 3"

[[line]]
id = "z1-tflite"
kind = "internal"
rule = "the ONNX file against the .tflite it was converted from (LiteRT interpreter, CPU, the same inputs): the PLAN section 3 line"
written = "2026-11-06T16:30:00+09:00"
written_note = "16:3x JST, PLAN.md Changes (after the first pass, before the quiet pass)"
plan = "john-rocky/windows-zoo PLAN.md, Changes 2026-11-06 16:3x"

[[line]]
id = "task-top1"
kind = "task"
rule = "keyword classification through the downstream head (the frontend's job is the head's input): the cell's features through w2v2_head_fp16_fixed (the head with the app's weights; the base head's file drops biases) in fp32 on the ONNX Runtime CPU EP, the argmax of the 12 logits; its top-1 equals the reference pipeline's on >= 95 % of the clips, a clip whose reference top-1 and top-2 probabilities differ by < 0.01 not counted. Inputs: the 120 clips of suites/audio/kws120.json (Speech Commands v0.01 test, 10 per label), each scaled as the app's microphone path (pcm / max(1, peak) x 0.5). Reference: the frontend's fp32 ONNX file (the one Z1 measured) and the same head, both on the ONNX Runtime 1.31.1 CPU EP."
written = "2026-11-10T06:41:00+09:00"
plan = "PLAN.md section Z5 (the Z5 lane, written 06:41 JST before any run of its cells)"

