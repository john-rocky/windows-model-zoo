task = "depth"
inputs = "suites/vision/images.json"

[[fetch]]
repo = "mlboydaisuke/Metric3D-v2-OpenVINO"
revision = "984de058e2ba8da22517cfe17cb826a65f7b0c71"
include = ["unfixed/fp16/metric3d_fp16.onnx", "unfixed/metric3d_fp16.onnx"]
