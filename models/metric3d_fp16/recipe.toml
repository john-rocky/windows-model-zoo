short = "fp16"
label = "Z1's fp16 copy of it (onnxruntime.transformers.float16.convert_float_to_float16(keep_io_types=True) with Z1's node fixes), checked by sha256"
made_by = "the vision zoo Z1"
path = "{HUB}\\mlboydaisuke__Metric3D-v2-OpenVINO\\unfixed\\fp16\\metric3d_fp16.onnx"
sha256 = "d96f90b7ad645ef2e5332b29f4c8711c0d691bf7a3fc33073aee3149f51ac068"
from = "mlboydaisuke/Metric3D-v2-OpenVINO"
public = "mlboydaisuke/Metric3D-v2-OpenVINO@984de058e2ba8da22517cfe17cb826a65f7b0c71:unfixed/fp16/metric3d_fp16.onnx"

[[form]]
id = "z1-onnx-fp32"
short = "fp32"
label = "the fp32 ONNX file the vision zoo Z1 measured (tf2onnx 1.17.0 from the source .tflite), checked by sha256"
made_by = "the vision zoo Z1"
path = "{HUB}\\mlboydaisuke__Metric3D-v2-OpenVINO\\unfixed\\metric3d_fp16.onnx"
sha256 = "ccde5da9c6c751bab40dd98285fc05706881b0667663f64f6b7850f89c6c414e"
from = "mlboydaisuke/Metric3D-v2-OpenVINO"
public = "mlboydaisuke/Metric3D-v2-OpenVINO@984de058e2ba8da22517cfe17cb826a65f7b0c71:unfixed/metric3d_fp16.onnx"

[[step]]
name = "task-ref"
phase = "before"
venv = "z1-ort"
script = "pc/ref_vision_task.py"
args = [
  "--model",
  "metric3d_fp16",
  "--spec",
  "{ROOT}\\pc\\z5_spec.json",
  "--fixtures",
  "{FIX}",
  "--suites",
  "{ROOT}\\suites",
  "--work",
  "{ROOT}\\work\\metric3d_fp16",
  "--out",
  "{ROOT}\\refs\\metric3d_fp16\\ref.json",
]
timeout_min = 30
ram_gb = 2
reference = "refs/metric3d_fp16/ref.json"

[[line]]
id = "z1-internal"
kind = "internal"
rule = "every output: cos >= 0.99 against the ONNX Runtime CPU EP fp32 output (yolact: OpenVINO CPU f32), no NaN / Inf; a class output: argmax agreement >= 0.99"
written = "2026-11-06T10:40:00+09:00"
written_note = "10:4x JST, before any run (windows-zoo ROUND1.md line 10); first run 12:53"
plan = "john-rocky/windows-zoo PLAN.md section 3"

[[line]]
id = "z1-tflite"
kind = "internal"
rule = "the ONNX file against the .tflite it was converted from (LiteRT interpreter, CPU, the same inputs): the PLAN section 3 line"
written = "2026-11-06T16:30:00+09:00"
written_note = "16:3x JST, PLAN.md Changes (after the first pass, before the quiet pass)"
plan = "john-rocky/windows-zoo PLAN.md, Changes 2026-11-06 16:3x"

[[line]]
id = "task-depth"
kind = "task"
rule = "depth, the app's metric depth in metres (john-rocky/LiteRT-Models@96e0bc1f/metric3d/.../MetricDepth.kt, 448 x 448; no scale alignment: the output is metric): AbsRel = the mean of |d - d_ref| / d_ref over the pixels of all inputs where d_ref > 0, <= 0.02; a non-finite cell value counts as an infinite error. Inputs: the 20 images of suites/vision/images.json, each centre-square cropped to 448 x 448, (x - [123.675, 116.28, 103.53]) / [58.395, 57.12, 57.375] on 0-255 RGB. Reference: the same fp32 ONNX file (the one the vision zoo Z1 measured) on the ONNX Runtime 1.31.1 CPU EP, on the same inputs (Z1's cpu cell)."
written = "2026-11-10T06:41:00+09:00"
plan = "PLAN.md section Z5 (the Z5 lane, written 06:41 JST before any run of its cells)"

