from = "mlboydaisuke/PP-OCRv5-OpenVINO"
public = "mlboydaisuke/PP-OCRv5-OpenVINO@1835e4bb5849bf416d9bb7d4775215663607f721:ppocr_det_fp16.onnx"

[[step]]
name = "task-ref"
phase = "before"
venv = "z1-ort"
script = "pc/ref_vision_task.py"
args = [
  "--model",
  "ppocr_det_fp16",
  "--spec",
  "{ROOT}\\pc\\z5_spec.json",
  "--fixtures",
  "{FIX}",
  "--suites",
  "{ROOT}\\suites",
