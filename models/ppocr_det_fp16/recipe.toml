  "{ROOT}\\work\\ppocr_det_fp16",
  "--out",
  "{ROOT}\\refs\\ppocr_det_fp16\\ref.json",
]
timeout_min = 30
ram_gb = 2
reference = "refs/ppocr_det_fp16/ref.json"

[[line]]
id = "z1-internal"
kind = "internal"
rule = "every output: cos >= 0.99 against the ONNX Runtime CPU EP fp32 output (yolact: OpenVINO CPU f32), no NaN / Inf; a class output: argmax agreement >= 0.99"
written = "2026-11-06T10:40:00+09:00"
written_note = "10:4x JST, before any run (windows-zoo ROUND1.md line 10); first run 12:53"
plan = "john-rocky/windows-zoo PLAN.md section 3"

[[line]]
id = "z1-tflite"
kind = "internal"
rule = "the ONNX file against the .tflite it was converted from (LiteRT interpreter, CPU, the same inputs): the PLAN section 3 line"
written = "2026-11-06T16:30:00+09:00"
written_note = "16:3x JST, PLAN.md Changes (after the first pass, before the quiet pass)"
plan = "john-rocky/windows-zoo PLAN.md, Changes 2026-11-06 16:3x"

[[line]]
id = "task-detection"
kind = "task"
rule = "text detection, the app's boxes (john-rocky/LiteRT-Models@96e0bc1f/ppocr/.../PpocrDetector.kt: probability > 0.3, 4-connected regions, width and height >= 6, mean probability >= 0.5, the box padded by 0.35 x min(w, h) clamped to 2..24 px, in the 640 x 640 input): a cell box pairs with a reference box at IoU >= 0.5 (one class), one to one, the cell's boxes taken in descending mean probability; the pairs are >= 95 % of the reference's boxes and >= 95 % of the cell's boxes, summed over the inputs (a set without a reference box has no verdict). Inputs: the 20 images of suites/vision/images.json, each letterboxed on white to 640 x 640, ImageNet normalization. Reference: the same fp32 ONNX file (the one the vision zoo Z1 measured) on the ONNX Runtime 1.31.1 CPU EP, on the same inputs (Z1's cpu cell)."
written = "2026-11-10T06:41:00+09:00"
plan = "PLAN.md section Z5 (the Z5 lane, written 06:41 JST before any run of its cells)"

