# mlsd_fp16: the cells copied from the vision zoo john-rocky/windows-zoo@faa4019 keep its numbers and its line; the cells task-* (2026-11-10) judge the same files on this model's task line (PLAN.md)

[model]
kind = "vision"
title = "mlsd_fp16"
group = "main"
order = 15
source = "litert-community/M-LSD-tiny-LiteRT"
source_revision = "ae7c5698d5bbef1976aa5a1f7ad7b9b28d324e3c"
source_file = "mlsd_fp16.tflite"
license = "apache-2.0"
pipeline_tag = "image-segmentation"
base_model = "navervision/mlsd"
notes = []
migrated_from = "john-rocky/windows-zoo@faa4019"
task = "line-segments"
inputs = "suites/vision/images.json"

[[fetch]]
repo = "mlboydaisuke/M-LSD-tiny-OpenVINO"
revision = "db488937a8c23fa5f2f6b59f5be70b5044960deb"
include = ["mlsd_fp16.onnx", "npu/mlsd_fp16.blob"]
why = "the vision zoo's files of this model's task cells (the same sha256 as the files measured)"

[[form]]
id = "z1-npu-blob"
short = "NPU blob"
label = "Z1's precompiled Intel NPU blob of it (OpenVINO 2026.4.1 compile_model + export_model), checked by sha256"
made_by = "the vision zoo Z1"
path = "{HUB}\\mlboydaisuke__M-LSD-tiny-OpenVINO\\npu\\mlsd_fp16.blob"
sha256 = "6c5cbc4581ec2981b608c4d1d65570797cb5d2e5d6a324811d72d333e374cf5c"
from = "mlboydaisuke/M-LSD-tiny-OpenVINO"
public = "mlboydaisuke/M-LSD-tiny-OpenVINO@db488937a8c23fa5f2f6b59f5be70b5044960deb:npu/mlsd_fp16.blob"

[[form]]
id = "z1-onnx-fp32"
short = "fp32"
label = "the fp32 ONNX file the vision zoo Z1 measured (tf2onnx 1.17.0 from the source .tflite), checked by sha256"
made_by = "the vision zoo Z1"
path = "{HUB}\\mlboydaisuke__M-LSD-tiny-OpenVINO\\mlsd_fp16.onnx"
sha256 = "73d41b40feb169e88bfa6428c5a4b2c735069d9848538f6d47535483a50c3537"
from = "mlboydaisuke/M-LSD-tiny-OpenVINO"
public = "mlboydaisuke/M-LSD-tiny-OpenVINO@db488937a8c23fa5f2f6b59f5be70b5044960deb:mlsd_fp16.onnx"

[[step]]
name = "task-ref"
phase = "before"
venv = "z1-ort"
script = "pc/ref_vision_task.py"
args = [
  "--model",
  "mlsd_fp16",
  "--spec",
  "{ROOT}\\pc\\z5_spec.json",
  "--fixtures",
  "{FIX}",
  "--suites",
  "{ROOT}\\suites",
  "--work",
  "{ROOT}\\work\\mlsd_fp16",
  "--out",
  "{ROOT}\\refs\\mlsd_fp16\\ref.json",
]
timeout_min = 30
ram_gb = 2
reference = "refs/mlsd_fp16/ref.json"

[[line]]
id = "z1-internal"
kind = "internal"
rule = "every output: cos >= 0.99 against the ONNX Runtime CPU EP fp32 output (yolact: OpenVINO CPU f32), no NaN / Inf; a class output: argmax agreement >= 0.99"
written = "2026-11-06T10:40:00+09:00"
written_note = "10:4x JST, before any run (windows-zoo ROUND1.md line 10); first run 12:53"
plan = "john-rocky/windows-zoo PLAN.md section 3"

[[line]]
id = "z1-tflite"
kind = "internal"
rule = "the ONNX file against the .tflite it was converted from (LiteRT interpreter, CPU, the same inputs): the PLAN section 3 line"
written = "2026-11-06T16:30:00+09:00"
written_note = "16:3x JST, PLAN.md Changes (after the first pass, before the quiet pass)"
plan = "john-rocky/windows-zoo PLAN.md, Changes 2026-11-06 16:3x"

[[line]]
id = "task-line-segments"
kind = "task"
rule = "line segments, the app's segments (john-rocky/LiteRT-Models@96e0bc1f/mlsd/.../MlsdDetector.kt: the sigmoid of the centre map > 0.10 with no larger value in its 3 x 3 neighbourhood, the 200 highest, the endpoints from the four displacement maps, a segment kept when its endpoints are more than 20 map pixels apart; endpoints in pixels of the 512 x 512 input): a cell segment pairs with a reference segment when both endpoints are within 0.02 of the input's diagonal (14.48 px), in either endpoint order, one to one, the cell's segments taken in descending score; the pairs are >= 95 % of the reference's segments and >= 95 % of the cell's, summed over the inputs. Inputs: the 20 images of suites/vision/images.json, each centre-square cropped to 512 x 512, RGB / 127.5 - 1 and the constant fourth channel 1 / 127.5 - 1. Reference: the same fp32 ONNX file (the one the vision zoo Z1 measured) on the ONNX Runtime 1.31.1 CPU EP, on the same inputs (Z1's cpu cell)."
written = "2026-11-10T06:41:00+09:00"
plan = "PLAN.md section Z5 (the Z5 lane, written 06:41 JST before any run of its cells)"

[[cell]]
id = "ovnpu"
runtime = "ort-ov"
device = "npu"
form = "onnx-fp32"
line = "z1-internal"
migrated = true
script = "windows-zoo:pc/zoo_run.py"

